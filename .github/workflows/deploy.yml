name: Check & deploy

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# One Pages deployment at a time; never cancel a main deploy midway.
# PR runs get their own group so they never queue behind (or cancel) main.
concurrency:
  group: ${{ github.event_name == 'pull_request' && format('pr-{0}', github.ref) || 'pages' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Format check
        run: npm run format:check

      - name: Typecheck
        run: npm run typecheck

      - name: Purity check
        run: npm run check:pure

      - name: Brand check
        run: npm run check:brand

      - name: Unit tests
        run: npm test

      - name: Build
        run: npm run build
        env:
          # Pages serves the site from /<repo>/, so a rename needs no code change.
          BASE_PATH: /${{ github.event.repository.name }}/

      - name: Check dist
        run: npm run check:dist
        env:
          # Pages serves the site from /<repo>/, so a rename needs no code change.
          BASE_PATH: /${{ github.event.repository.name }}/

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: E2E tests
        run: npm run test:e2e
        env:
          # Pages serves the site from /<repo>/, so a rename needs no code change.
          BASE_PATH: /${{ github.event.repository.name }}/

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7

      - name: Configure Pages
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  deploy:
    needs: check
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  # Optional, non-blocking Lighthouse audit of the production build.
  # Scores land in the "lighthouse-report" artifact; nothing depends on this job.
  lighthouse:
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    continue-on-error: true
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build
        env:
          BASE_PATH: /${{ github.event.repository.name }}/

      - name: Start preview server
        run: |
          npx vite preview --host 127.0.0.1 --port 4173 --strictPort > preview.log 2>&1 &
          npx --yes wait-on@8 --timeout 60000 "http://127.0.0.1:4173/${REPO}/"
        env:
          BASE_PATH: /${{ github.event.repository.name }}/
          REPO: ${{ github.event.repository.name }}

      - name: Run Lighthouse
        run: |
          mkdir -p lighthouse
          npx --yes lighthouse@12 "http://127.0.0.1:4173/${REPO}/" \
            --only-categories=performance,accessibility,best-practices \
            --output=html --output=json --output-path=lighthouse/report \
            --chrome-flags="--headless=new --no-sandbox"
          node -e 'const r=require("./lighthouse/report.report.json");for(const c of Object.values(r.categories))console.log(`${c.title}: ${Math.round(c.score*100)}`)' | tee -a "$GITHUB_STEP_SUMMARY"
        env:
          REPO: ${{ github.event.repository.name }}

      - name: Upload Lighthouse report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lighthouse-report
          path: lighthouse/
          retention-days: 14
